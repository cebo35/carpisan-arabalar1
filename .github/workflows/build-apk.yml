name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK via Cordova
      run: |
        npm install -g cordova
        cordova create build_app com.oyun.carpisanarabalar "CarpisanArabalar"
        cd build_app
        cordova platform add android
        rm -rf www/*
        cp ../bumper_car_battle.html www/index.html
        cordova build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarpisanArabalar-APK
        path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
